<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Register — Skillarium</title>
<meta name="description" content="Skillarium Portal — teacher ESS, student registration and admin dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div id="loader"><div><div class="brand">Skillarium</div><div class="bar"><i></i></div></div></div>

<section class="page-hero"><div class="wrap">
  <div class="crumbs"><a href="/index.html">Home</a> / Portal / Register</div>
  <h1 class="fade-up d1">Portal registration</h1>
  <p class="fade-up d2">Teacher ESS & student accounts — animated, fast, and ready for campus use.</p>
</div></section>
<section><div class="wrap" style="max-width:640px">
  <div class="form-card" data-reveal>
    <div class="tabs">
      <a class="active" href="/portal/index.html">Register</a>
      <a href="/portal/login.html">Login</a>
      <a href="/portal/dashboard.html">Dashboard</a>
    </div>
    <p class="eyebrow">New account</p>
    <h2 style="font-size:1.7rem;margin-bottom:.3rem">Create your portal profile</h2>
    <p class="hint" style="margin-bottom:1.2rem">Teachers need a password. Students are added to the roster instantly.</p>
    <div class="alert" id="alert"></div>
    <form id="regForm">
      <div class="field"><label for="name">Full name</label><input id="name" required maxlength="100" placeholder="Your full name"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" required placeholder="you@example.com"></div>
      <div class="field"><label>Role</label>
        <div class="roles">
          <label><input type="radio" name="role" value="Teacher" required> Teacher</label>
          <label><input type="radio" name="role" value="Student" required> Student</label>
        </div>
      </div>
      <div class="field" id="pwWrap"><label for="password">Password <span class="hint">(teachers only, min 8)</span></label>
        <input id="password" type="password" maxlength="255" placeholder="Min 8 characters" autocomplete="new-password"></div>
      <button class="btn btn-navy btn-block" id="btn" type="submit">Register</button>
    </form>
    <p class="hint" style="text-align:center;margin-top:1rem">Already registered? <a href="/portal/login.html" style="color:var(--navy);font-weight:600">Login</a></p>
  </div>
</div></section>

<script src="/assets/app.js" defer></script>
<script src="/assets/portal.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  var pw = document.getElementById('password');
  var wrap = document.getElementById('pwWrap');
  function sync() {
    var r = document.querySelector('input[name=role]:checked');
    var t = r && r.value === 'Teacher';
    pw.required = !!t;
    wrap.style.opacity = t ? '1' : '.55';
  }
  document.querySelectorAll('input[name=role]').forEach(function (el) { el.addEventListener('change', sync); });
  sync();
  document.getElementById('regForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Registering…';
    var roleEl = document.querySelector('input[name=role]:checked');
    var role = roleEl ? roleEl.value : '';
    SkillariumPortal.register({
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      role: role,
      password: document.getElementById('password').value
    }).then(function () {
      Skillarium.alertBox(document.getElementById('alert'), 'ok', role + ' registered successfully. You can log in now.');
      e.target.reset(); sync();
    }).catch(function (err) {
      Skillarium.alertBox(document.getElementById('alert'), 'bad', (err && err.message) || 'Failed');
    }).then(function () {
      btn.disabled = false; btn.textContent = 'Register';
    });
  });
});
</script>
<script defer>document.addEventListener('DOMContentLoaded',function(){ if(window.Skillarium) Skillarium.boot('portal'); });</script>
</body>
</html>
