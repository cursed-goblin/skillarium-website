<title>Teach with us — Skillarium</title>

<body>
<main>
<div class="page-head">
  <div class="wrap">
    <div class="crumb"><a href="index.html">Home</a> / Faculty application</div>
    <h1>Teach with us</h1>
    <p>We hire instructors who have built things, not only taught them. Send your resume — industry professionals teaching one evening a week are very welcome.</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="form-shell">
      <div>
        <div class="alert" id="alert" role="status"></div>

        <div class="form-card" id="formCard">
          <form id="form" novalidate>
            <fieldset class="fieldset">
              <legend>About you</legend>
              <div class="field half-row">
                <div class="field"><label for="full_name">Full name <span class="req">*</span></label>
                  <input id="full_name" type="text" required autocomplete="name"><div class="err"></div></div>
                <div class="field"><label for="city">City / town</label>
                  <input id="city" type="text" autocomplete="address-level2"><div class="err"></div></div>
              </div>
              <div class="field half-row">
                <div class="field"><label for="phone">Phone <span class="req">*</span></label>
                  <input id="phone" type="tel" required autocomplete="tel" placeholder="98470 00000"><div class="err"></div></div>
