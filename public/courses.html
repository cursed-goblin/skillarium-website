<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courses — Skillarium</title>
<meta name="description" content="Coding, AI and STEM courses at Skillarium Academy, Thrissur. Duration, fees and outcomes published for every programme.">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/config.js"></script>
</head>
<body>
<main>
<div class="page-head">
  <div class="wrap">
    <div class="crumb"><a href="index.html">Home</a> / Courses</div>
    <h1>Courses</h1>
    <p>Every programme lists its duration, fee and outcome up front. Pick one and apply, or message us if you are unsure which level fits.</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="grid g2" id="grid"></div>
  </div>
</section>

<section class="soft tight">
  <div class="wrap narrow" style="text-align:center">
    <h2 style="font-size:27px">Want a course we do not run yet?</h2>
    <p class="sub" style="margin-bottom:22px">Tell us what you need. We open new batches based on demand.</p>
    <a class="btn btn-primary" href="contact.html">Request a course</a>
  </div>
</section>
</main>

<script type="module">
import { chrome, getCourses, esc, money, $ } from "./assets/app.js";
chrome("courses.html");
const courses = await getCourses();
$("#grid").innerHTML = courses.map(c => `
  <div class="card">
    <div class="card-top">
      <h3>${esc(c.title)}</h3>
      <span class="tag blue">${esc(c.level || "")}</span>
    </div>
    <p>${esc(c.description || c.tagline || "")}</p>
    <ul class="meta">
      <li>Duration <b>${esc(c.duration || "—")}</b></li>
      <li>Mode <b>${esc(c.mode || "—")}</b></li>
      <li>Fee <b>${money(c.fee_amount)}</b></li>
    </ul>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn btn-primary btn-sm" href="apply-student.html?course=${esc(c.slug)}">Apply</a>
      <a class="btn btn-ghost btn-sm" href="course.html?c=${esc(c.slug)}">Details</a>
    </div>
  </div>`).join("");
</script>
</body>
</html>
